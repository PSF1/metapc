# Builds MetaPC for every supported platform and uploads one package per
# platform as a workflow artifact:
#   - Linux:   AppImage built on Ubuntu 20.04, runs on Ubuntu 20.04 and newer.
#   - Windows: zip with pcem.exe and the MSYS2 UCRT64 DLLs it needs.
#   - macOS:   zip with MetaPC.app (Apple Silicon, ad-hoc signed).
name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Number'
        required: false
        default: 'vNext'
        type: string

env:
  VERSION: ${{ inputs.version || 'vNext' }}

jobs:
  linux:
    name: Linux x86_64 (AppImage, Ubuntu 20.04+)
    runs-on: ubuntu-latest
    # Building on Ubuntu 20.04 sets the glibc baseline to 2.31. Ubuntu 20.04
    # only ships wxWidgets 3.0, which is too old, so wxWidgets 3.2 is built
    # from source and linked statically.
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1
      WX_VERSION: 3.2.6
      CMAKE_VERSION: 3.31.6
    defaults:
      run:
        shell: bash

    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates pkg-config ninja-build file \
            libgtk-3-dev libsdl2-dev libopenal-dev libpcap-dev libslirp-dev \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev \
            desktop-file-utils squashfs-tools
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache wxWidgets
        id: wxcache
        uses: actions/cache@v4
        with:
          path: /opt/wx
          key: wx-${{ env.WX_VERSION }}-focal-static-gtk3-v1

      - name: Build wxWidgets
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/wx.tar.bz2 \
            "https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2"
          mkdir -p /tmp/wxsrc
          tar -xjf /tmp/wx.tar.bz2 -C /tmp/wxsrc --strip-components=1
          cd /tmp/wxsrc
          ./configure --prefix=/opt/wx --disable-shared --with-gtk=3 \
            --disable-sys-libs --without-libnotify --disable-webview \
            --disable-mediactrl --without-opengl
          make -j"$(nproc)"
          make install

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # GCC 9 does not know -march=x86-64-v2 (GCC 11+); nehalem enables
          # the same instruction set (SSE4.2, POPCNT, CX16).
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            "-DPCEM_MARCH=nehalem -mtune=generic" \
            -DwxWidgets_CONFIG_EXECUTABLE=/opt/wx/bin/wx-config \
            -DPCEM_VERSION_STRING="$VERSION build ${GITHUB_SHA::8}"

      - name: Build
        run: ninja -C build

      - name: Package
        run: |
          DESTDIR="$PWD/AppDir" ninja -C build install
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          export DEPLOY_GTK_VERSION=3
          export LINUXDEPLOY_OUTPUT_VERSION="$VERSION-${GITHUB_SHA::8}"
          ./linuxdeploy --appdir AppDir \
            -e AppDir/usr/bin/pcem \
            -d cmake/linux/metapc.desktop \
            -i cmake/linux/metapc.png \
            --plugin gtk \
            --output appimage
          mkdir -p artifacts
          mv MetaPC-*.AppImage artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaPC-${{ env.VERSION }}-Linux-x86_64-${{ github.run_number }}
          path: artifacts/*.AppImage

  windows:
    name: Windows x64 (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          pacboy: >-
            ntldd-git:p
            toolchain:p
            SDL2:p
            openal:p
            wxwidgets3.2-msw:p
            cmake:p
            libslirp:p
            libpcap:p
            ninja:p
          install: >-
            zip

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DMSYS=TRUE \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/dist" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPCEM_VERSION_STRING="$VERSION build ${GITHUB_SHA::8}"

      - name: Build
        run: ninja -C build

      - name: Package
        run: |
          ninja -C build install
          mkdir -p artifacts
          ARCHIVE="$(pwd)/artifacts/MetaPC-$VERSION-Windows-x64-${GITHUB_SHA::8}.zip"
          cd dist
          ntldd -R "bin/pcem.exe" | sed -e 's/^[[:blank:]]*//g' | cut -d ' ' -f 3 \
            | grep -E -i '(mingw|clang|ucrt)(32|64)' | sed -e 's|\\|/|g' \
            | xargs -r cp --target-directory="bin"
          zip -r -9 "$ARCHIVE" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaPC-${{ env.VERSION }}-Windows-x64-${{ github.run_number }}
          path: artifacts/*.zip

  macos:
    name: macOS arm64 (MetaPC.app)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packages
        run: brew install cmake libslirp ninja pkgconf sdl2-compat wxwidgets

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPCEM_VERSION_STRING="$VERSION build ${GITHUB_SHA::8}"

      - name: Build
        run: ninja -C build

      - name: Package
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/src/MetaPC.app \
            "artifacts/MetaPC-$VERSION-macOS-arm64-${GITHUB_SHA::8}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaPC-${{ env.VERSION }}-macOS-arm64-${{ github.run_number }}
          path: artifacts/*.zip
