# Builds MetaPC as an AppImage inside an Ubuntu 20.04 container, so the result
# runs on Ubuntu 20.04 and newer (glibc 2.31 baseline). Ubuntu 20.04 ships
# wxWidgets 3.0, which is too old, so wxWidgets 3.2 is built from source and
# linked statically.
name: Linux AppImage (Ubuntu 20.04+)

on:
  workflow_dispatch:
  push:
    branches: [dev]

env:
  WX_VERSION: 3.2.6
  CMAKE_VERSION: 3.31.6

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1
    defaults:
      run:
        shell: bash

    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates pkg-config ninja-build file \
            libgtk-3-dev libsdl2-dev libopenal-dev libpcap-dev libslirp-dev \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libsecret-1-dev \
            desktop-file-utils squashfs-tools
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache wxWidgets
        id: wxcache
        uses: actions/cache@v4
        with:
          path: /opt/wx
          key: wx-${{ env.WX_VERSION }}-focal-static-gtk3-v1

      - name: Build wxWidgets
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/wx.tar.bz2 \
            "https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2"
          mkdir -p /tmp/wxsrc
          tar -xjf /tmp/wx.tar.bz2 -C /tmp/wxsrc --strip-components=1
          cd /tmp/wxsrc
          ./configure --prefix=/opt/wx --disable-shared --with-gtk=3 \
            --with-libpng=builtin --with-libjpeg=builtin --with-libtiff=builtin \
            --with-zlib=builtin --with-expat=builtin --with-regex=builtin \
            --without-libnotify --disable-webview --disable-mediactrl \
            --disable-sys-libs --without-opengl
          make -j"$(nproc)"
          make install

      - name: Configure
        run: |
          export PATH=/opt/wx/bin:$PATH
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DwxWidgets_CONFIG_EXECUTABLE=/opt/wx/bin/wx-config \
            -DPCEM_VERSION_STRING="vNext build ${GITHUB_SHA::8}"

      - name: Build
        run: ninja -C build

      - name: Package AppImage
        run: |
          DESTDIR="$PWD/AppDir" ninja -C build install
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          export DEPLOY_GTK_VERSION=3
          export LINUXDEPLOY_OUTPUT_VERSION="${GITHUB_SHA::8}"
          ./linuxdeploy --appdir AppDir \
            -e AppDir/usr/bin/pcem \
            -d cmake/linux/metapc.desktop \
            -i cmake/linux/metapc.png \
            --plugin gtk \
            --output appimage
          mkdir -p artifacts
          mv MetaPC-*.AppImage artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaPC-Linux-x86_64-AppImage
          path: artifacts/*.AppImage
